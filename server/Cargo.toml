[package]
name = "server"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true
opt-level = "z"
lto = true


[dependencies]
bincode = "1.3"
chrono = { version = "0.4.40", default-features = false, features = ["now"] }
env_logger = "0.11.8"
hex = "0.4.3"
log = "0.4.27"
once_cell = "1"
prometheus = { version = "0.13", features = ["process"] }
rocket = { version = "0.5", default-features = false, features = ["http2"] }
rusty_enet = { version = "0.4", features = ["connected"] }
serde = {version = "1", features = ["derive"] }
serde_json = "1"
sodiumoxide = "0.2.7"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.21.0", features = ["v4"] }
rand = "0.8"
tokio-xmpp = "5"
futures = "0.3"

